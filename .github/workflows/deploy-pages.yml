# Deploy frontend/ sebagai static website ke GitHub Pages.
# Aktifkan di repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS (npm 11) — versi yang sama dengan yang membuat frontend/package-lock.json.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci, lockfile sinkron)
        run: npm ci --no-audit --no-fund
      - name: Build static site
        # Project site: https://<user>.github.io/<repo>/  ->  base "/<repo>/"
        # Jika memakai custom domain atau repo <user>.github.io, ganti dengan "/".
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          DISABLE_VISUAL_EDITS: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
